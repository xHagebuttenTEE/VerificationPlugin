roles:
  default: "default"
  verified: "i"

display:
  verifiedRole: "I"

history:
  enabled: true
  maxEntriesInInfo: 3
  maxEntriesInHistoryCommand: 10

progress:
  enabled: true
  track-advancements: true
  track-rank-changes: true
  maxEntriesInDetails: 10

milestones:
  enabled: true
  check-interval-seconds: 60
  broadcast-on-reach: true
  definitions: []

statistics:
  enabled: true
  flush-interval-seconds: 300
  track-playtime: true
  track-balance: true
  track-cumulative-earned: true

advanced-stats:
  enabled: true
  identifiers:
    - MOB_KILLS
    - PLAY_ONE_MINUTE
    - WALK_ONE_CM

cache:
  info-ttl-seconds: 30

healthcheck:
  enabled: true
  interval-seconds: 60

ui:
  entries-per-page: 45