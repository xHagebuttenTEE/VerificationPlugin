name: VerificationPlugin
version: '${version}'
main: de.hage.verification.VerificationPlugin
api-version: '1.21'
depend:
  - Vault
softdepend:
  - LuckPerms

commands:
  verification:
    description: Verifiziert Spieler und zeigt Verifizierungsinformationen
    usage: /verification <new|info|history|ui|stats|leaderboard|resetmessages|resetconfig|resetdatabase> [Spieler]
    aliases: [verify]

permissions:
  verification.new:
    description: Darf Spieler verifizieren
    default: op
  verification.info:
    description: Darf Verifizierungsinfos, Historie, UI, Statistiken und Ranglisten einsehen
    default: op
  verification.admin:
    description: Darf Konfigurationsdateien zurücksetzen
    default: op