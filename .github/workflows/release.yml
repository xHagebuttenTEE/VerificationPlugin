name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PLUGIN_FILE_NAME: VerificationPlugin
  BUILD_TASK: shadowJar
  JAR_PATH: build/libs/*.jar

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          set -e
          CURRENT=$(grep -E '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$CURRENT" ]; then
            echo "FEHLER: Keine 'version=' Zeile in gradle.properties gefunden"
            exit 1
          fi

          MAJOR=$(echo "$CURRENT" | cut -d'.' -f1)
          MINOR=$(echo "$CURRENT" | cut -d'.' -f2)
          PATCH=$(echo "$CURRENT" | cut -d'.' -f3)
          if [ -z "$PATCH" ]; then PATCH=0; fi

          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Alte Version: $CURRENT"
          echo "Neue Version: $NEW"

          sed -i "s/^version=.*/version=$NEW/" gradle.properties

          echo "NEW_VERSION=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VERSION }} [skip ci]"
          git push origin main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew ${{ env.BUILD_TASK }} --no-daemon

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_FILE_NAME }}-${{ steps.bump.outputs.NEW_VERSION }}
          path: ${{ env.JAR_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.PLUGIN_FILE_NAME }} ${{ steps.bump.outputs.NEW_VERSION }}
          tag_name: v${{ steps.bump.outputs.NEW_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.JAR_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}