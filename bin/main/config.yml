database:
  type: "auto"
  host: "127.0.0.1"
  port: 3306
  name: ""
  user: ""
  password: ""
  sqlite:
    file: "verification.db"
  table: "verification_system"
  pool:
    maxPoolSize: 10
    minIdle: 2
    connectionTimeout: 30000

roles:
  default: "bettler"
  verified: "i"

display:
  verifiedRole: "I"

history:
  enabled: true
  maxEntriesInInfo: 3
  maxEntriesInHistoryCommand: 10

progress:
  enabled: true
  track-advancements: true
  track-rank-changes: true
  maxEntriesInDetails: 10

statistics:
  enabled: true
  flush-interval-seconds: 300
  track-playtime: true
  track-balance: true
  track-cumulative-earned: true

cache:
  info-ttl-seconds: 30

healthcheck:
  enabled: true
  interval-seconds: 60

ui:
  entries-per-page: 45